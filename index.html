<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weekly Knowledge Challenge</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <header>

        <h1>
            🧠 Weekly Knowledge Challenge
        </h1>

        <p id="quiz-title">
            Loading quiz...
        </p>

    </header>


    <main>


        <!-- Progress -->

        <section id="progress">

            <div class="progress-info">

                <span>
                    Progress
                </span>

                <span id="progress-text">
                    0 / 25
                </span>

            </div>


            <div class="progress-bar">

                <div id="progress-fill"></div>

            </div>

        </section>


        <!-- Quiz -->

        <div id="quiz-container">

            <p>
                Loading questions...
            </p>

        </div>


        <!-- Results -->

        <section id="results">

            <section id="results">

    <h2>Your Score</h2>

    <div id="score">
        0 / 25
    </div>

    <div id="score-percentage">
        0%
    </div>

    <p id="score-message">
        Let's get started!
    </p>

    <div id="result-summary">
        Answer questions to see your result.
    </div>

    <button
        id="reset-button"
        onclick="resetQuiz()"
    >
        Reset This Week's Quiz
    </button>

</section>


    </main>


    <footer>

        <p>
            Weekly Quiz • Week
            <span id="week-number">1</span>
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
