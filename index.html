<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Knowledge Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🧠 Weekly Knowledge Challenge</h1>
        <p id="quiz-title">Loading quiz...</p>
    </header>

<main>

    <section id="progress">

        <div class="progress-info">

            <span>
                Progress
            </span>

            <span id="progress-text">
                0 / 25
            </span>

        </div>

        <div class="progress-bar">

            <div id="progress-fill"></div>

        </div>

    </section>


    <div id="quiz-container">
            <p>Loading questions...</p>
        </div>

        <section id="results">
            <h2>Your Score</h2>

            <div id="score">
                0 / 25
            </div>

            <p id="score-message">
                Complete the quiz to see your result.
            </p>
        </section>

    </main>

    <footer>
        <p>Weekly Quiz • Week <span id="week-number">1</span></p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
